<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas Terminal PoC</title>
<link rel="preload" href="BerkeleyMonoVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<style>
  @font-face {
    font-family: 'Berkeley Mono';
    src: url('BerkeleyMonoVariable.woff2') format('woff2');
    font-weight: 100 900;
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    padding: 60px 20px;
    font-family: var(--mono);
    color: var(--dk);
  }
  h1 {
    font-family: var(--din-r);
    font-variation-settings: 'wght' 300;
    font-size: 36px;
    color: var(--dk-hi);
  }
  .demo {
    max-width: 640px;
    width: 100%;
  }
  .demo canvas {
    width: 100%;
    height: auto;
    border-radius: 10px;
    filter: drop-shadow(0 4px 24px rgba(0,0,0,0.4));
  }
  .label {
    font-size: 12px;
    color: var(--dk-5);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
  <h1>Canvas terminal renders</h1>

  <div class="demo">
    <div class="label">hero</div>
    <canvas data-termdata="{&quot;w&quot;:50,&quot;h&quot;:11,&quot;lines&quot;:[&quot;\u001b[0;32;49m╭─ glyph ────────────────────────────────────────╮\u001b[0m&quot;,&quot;\u001b[0;32;49m│╔═ system ═════╗\u001b[0;39;49m \u001b[0;1;36;49mmetrics\u001b[0;39;49m                        \u001b[0;32;49m│\u001b[0m&quot;,&quot;\u001b[0;32;49m│║● ONLINE\u001b[0;39;49m      \u001b[0;32;49m║\u001b[0;39;49m \u001b[0;36;49m───────────────────────────────\u001b[0;32;49m│\u001b[0m&quot;,&quot;\u001b[0;32;49m│║──────────────║\u001b[0;39;49m \u001b[0;36;49mrequests..................1,247\u001b[0;32;49m│\u001b[0m&quot;,&quot;\u001b[0;32;49m│║CPU.........72║\u001b[0;39;49m \u001b[0;36;49mlatency....................42ms\u001b[0;32;49m│\u001b[0m&quot;,&quot;\u001b[0;32;49m│║MEM.........48║\u001b[0;39;49m \u001b[0;36;49merrors.....................0.1%\u001b[0;32;49m│\u001b[0m&quot;,&quot;\u001b[0;32;49m│║    ▂▄▁▇▃▆▂▄█▃║\u001b[0;39;49m \u001b[0;36;49muptime....................99.9%\u001b[0;32;49m│\u001b[0m&quot;,&quot;\u001b[0;32;49m│╚══════════════╝\u001b[0;39;49m                                \u001b[0;32;49m│\u001b[0m&quot;,&quot;\u001b[0;32;49m│\u001b[0;39;49m────────────────────────────────────────────────\u001b[0;32;49m│\u001b[0m&quot;,&quot;\u001b[0;32;49m│all systems operational\u001b[0;39;49m                         \u001b[0;32;49m│\u001b[0m&quot;,&quot;\u001b[0;32;49m╰────────────────────────────────────────────────╯\u001b[0m&quot;]}"></canvas>

  <div class="demo">
    <div class="label">fuzzy finder</div>
    <canvas data-termdata="{&quot;w&quot;:50,&quot;h&quot;:11,&quot;lines&quot;:[&quot;╭─ packages ─────────────────────────────────────╮&quot;,&quot;│\u001b[0;1;39;49m\u003e \u001b[0;7;39;49ms\u001b[0;2;39;49mearch packages...\u001b[0;39;49m                            │&quot;,&quot;│\u001b[0;2;39;49m  7/7\u001b[0;39;49m                                           │&quot;,&quot;│\u003e \u001b[0;1;39;49mglyph\u001b[0;39;49m  \u001b[0;90;49mterminal UI framework\u001b[0;39;49m                  │&quot;,&quot;│  \u001b[0;1;39;49mcobra\u001b[0;39;49m  \u001b[0;90;49mCLI command framework\u001b[0;39;49m                  │&quot;,&quot;│  \u001b[0;1;39;49mviper\u001b[0;39;49m  \u001b[0;90;49mconfiguration management\u001b[0;39;49m               │&quot;,&quot;│  \u001b[0;1;39;49mzap\u001b[0;39;49m  \u001b[0;90;49mstructured logging\u001b[0;39;49m                       │&quot;,&quot;│  \u001b[0;1;39;49mchi\u001b[0;39;49m  \u001b[0;90;49mHTTP router\u001b[0;39;49m                              │&quot;,&quot;│  \u001b[0;1;39;49msqlc\u001b[0;39;49m  \u001b[0;90;49mtype-safe SQL\u001b[0;39;49m                           │&quot;,&quot;│  \u001b[0;1;39;49ment\u001b[0;39;49m  \u001b[0;90;49mentity framework\u001b[0;39;49m                         │&quot;,&quot;╰────────────────────────────────────────────────╯&quot;]}"></canvas>

  <div class="demo">
    <div class="label">live dashboard</div>
